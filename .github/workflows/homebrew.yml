name: Homebrew

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formula:
    name: Formula
    runs-on: macos-latest
    env:
      FORMULA: shellcheck-legibility
      TAP: yowainwright/shellcheck_legibility
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Tap formula
        run: brew tap "$TAP" "$GITHUB_WORKSPACE"

      - name: Trust tap
        run: brew trust "$TAP"

      - name: Install formula from HEAD
        if: github.event_name == 'push'
        run: brew install --HEAD --build-from-source "$FORMULA"

      - name: Test formula
        if: github.event_name == 'push'
        run: brew test "$FORMULA"

      - name: Audit formula
        run: brew audit --formula "$FORMULA"
